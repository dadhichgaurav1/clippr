    body {

      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 8px;
    }
    .btn-row {
      display: flex;
      gap: 12px;
    }
    button {
      width: 40px;
      height: 40px;
      border-radius: 50%;
      border: 1px solid #cfd9de;
      background: white;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: background 0.2s;
    }
    button:hover { background: #f7f9f9; }
    button svg { width: 20px; height: 20px; fill: #0f1419; }
    h3 { font-size: 13px; margin: 0; }
  </style>
</head>
