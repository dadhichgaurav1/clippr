<!DOCTYPE html>
<html>
<head>
  <style>
    body {
      width: 250px;
      padding: 16px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }
    h2 { font-size: 16px; margin-top: 0; }
    p { font-size: 12px; color: #536471; }
    button {
      width: 100%;
      padding: 10px;
      margin-bottom: 8px;
      border-radius: 9999px;
      border: 1px solid #cfd9de;
      background: white;
      font-weight: bold;
      cursor: pointer;
    }
    button:hover { background: #f7f9f9; }
    .primary { background: #0f1419; color: white; border: none; }
    .primary:hover { background: #272c30; }
  </style>
</head>
<body>
  <h2>X Article Downloader</h2>
  <p>Open an X Article to download it as PDF or Markdown.</p>
  <button id="downloadMD" class="primary">Download Markdown</button>
  <button id="downloadPDF">Download PDF</button>
  <script src="popup.js"></script>
</body>
</html>
